# Give your free in-memory database a clean system name
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1

# Use standard driver settings
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Production Behavior Simulation: Automatically generate database tables based on our Java Entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the IntelliJ console logs so we can debug operations
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable the free embedded H2 Web Console interface for local testing
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
